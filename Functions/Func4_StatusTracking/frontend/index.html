<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Application Process Flow Demo</title>
    <link rel="stylesheet" href="app.css">
    <link rel="stylesheet" href="calendar.css">
  </head>
  <body>
    <header>
      <h1>Application Process Flow (Live)</h1>
      <div class="header-controls">
        <div id="status" class="muted">Connecting…</div>
        <div class="view-toggle">
          <button id="btn-chat">Chat</button>
          <button id="btn-timeline" class="active">Timeline</button>
        </div>
      </div>
    </header>

    <div class="layout">
      <main>
        <div id="timeline-view">
          <h2>Timeline View</h2>
          <div id="container"><!-- cards will be rendered here --></div>
        </div>

        <div id="chat-view" style="display:none;">
          <h2>Chat with Assistant</h2>
          <div id="chat-panel">
            <div id="chat-messages" class="chat-messages"></div>
            <div class="chat-input">
              <input id="chat-input" type="text" placeholder="向助手提问，例如：帮我安排接下来的面试日程" />
              <button id="chat-send">Send</button>
            </div>
          </div>
        </div>
      </main>

      <aside id="calendar">
        <h2>Calendar View</h2>
        <div class="calendar-header">
          <div class="calendar-nav">
            <button onclick="calendar.prevMonth()">&larr;</button>
            <button onclick="calendar.nextMonth()">&rarr;</button>
          </div>
          <div class="calendar-title"></div>
        </div>
        <div class="calendar-grid">
          <!-- calendar will be rendered here -->
        </div>
      </aside>
    </div>

    <script src="app.js"></script>
    <script src="calendar.js"></script>
  </body>
</html>
